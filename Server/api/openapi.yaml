# Generated language bindings use this file as their source of truth.
openapi: "3.1.0"
info:
  title: "Sotto API"
  version: "1.0.0"
  description: "Shared transport contract for the Swift client and TypeScript server. Optional properties are omitted rather than encoded as null. Dates use whole-second ISO8601 UTC timestamps."
servers:
  -
    url: "http://localhost:8391"
security:
  -
    bearerAuth: []
x-sotto-apiVersion: 1
x-sotto-recordingProtocol: "sotto.recording.v1"
x-sotto-defaultPort: 8391
x-sotto-maximumRecordingSeconds: 180
x-sotto-maximumChunkBytes: 1048576
x-sotto-maximumArtifactBytes: 8388608
x-sotto-maximumDictionaryBytes: 8388608
paths:
  "/v1/health":
    get:
      operationId: "getHealth"
      responses:
        "200":
          description: "Success"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ServerHealth"
        default:
          "$ref": "#/components/responses/APIError"
      security: []
  "/v1/preferences":
    get:
      operationId: "getPreferences"
      responses:
        "200":
          description: "Success"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/PreferencesSnapshot"
        default:
          "$ref": "#/components/responses/APIError"
    put:
      operationId: "updatePreferences"
      responses:
        "200":
          description: "Success"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/PreferencesSnapshot"
        default:
          "$ref": "#/components/responses/APIError"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/PreferencesSnapshot"
        x-maximumBytes: 262144
  "/v1/generations":
    get:
      operationId: "listGenerations"
      responses:
        "200":
          description: "Success"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/GenerationPage"
        default:
          "$ref": "#/components/responses/APIError"
      parameters:
        -
          name: "limit"
          in: "query"
          required: false
          schema:
            type: "integer"
            minimum: 1
            maximum: 100
            default: 50
        -
          name: "before"
          in: "query"
          required: false
          schema:
            type: "string"
        -
          name: "source"
          in: "query"
          required: false
          schema:
            type: "string"
            enum:
              - "sotto"
              - "wispr-flow"
    post:
      operationId: "createGeneration"
      responses:
        "201":
          description: "Success"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/GenerationRecord"
        default:
          "$ref": "#/components/responses/APIError"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/CreateGenerationRequest"
        x-maximumBytes: 262144
  "/v1/generations/{id}":
    get:
      operationId: "getGeneration"
      responses:
        "200":
          description: "Success"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/GenerationRecord"
        default:
          "$ref": "#/components/responses/APIError"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            "$ref": "#/components/schemas/UUID"
    delete:
      operationId: "deleteGeneration"
      responses:
        "204":
          description: "Success"
        default:
          "$ref": "#/components/responses/APIError"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            "$ref": "#/components/schemas/UUID"
  "/v1/generations/{id}/audio/{kind}":
    post:
      operationId: "appendAudio"
      responses:
        "200":
          description: "Success"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/AudioChunkReceipt"
        default:
          "$ref": "#/components/responses/APIError"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            "$ref": "#/components/schemas/UUID"
        -
          name: "kind"
          in: "path"
          required: true
          schema:
            "$ref": "#/components/schemas/AudioKind"
        -
          name: "sequence"
          in: "query"
          required: true
          schema:
            type: "integer"
            minimum: 0
            maximum: 4095
        -
          name: "sampleRate"
          in: "query"
          required: true
          schema:
            type: "integer"
            minimum: 8000
            maximum: 192000
        -
          name: "channels"
          in: "query"
          required: true
          schema:
            type: "integer"
            minimum: 1
            maximum: 8
      requestBody:
        required: true
        content:
          "application/octet-stream":
            schema:
              type: "string"
              format: "binary"
        description: "Raw interleaved little-endian float32 PCM. Chunks must contain whole frames. Repeated sequences must have identical bytes."
        x-maximumBytes: 1048576
  "/v1/generations/{id}/finish":
    post:
      operationId: "finishGeneration"
      responses:
        "202":
          description: "Success"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/GenerationRecord"
        default:
          "$ref": "#/components/responses/APIError"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/FinishGenerationRequest"
        x-maximumBytes: 262144
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            "$ref": "#/components/schemas/UUID"
  "/v1/generations/{id}/cancel":
    post:
      operationId: "cancelGeneration"
      responses:
        "200":
          description: "Success"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/GenerationRecord"
        default:
          "$ref": "#/components/responses/APIError"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            "$ref": "#/components/schemas/UUID"
  "/v1/generations/{id}/delivery":
    post:
      operationId: "recordDelivery"
      responses:
        "200":
          description: "Success"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/GenerationRecord"
        default:
          "$ref": "#/components/responses/APIError"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/DeliveryReceipt"
        x-maximumBytes: 262144
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            "$ref": "#/components/schemas/UUID"
  "/v1/generations/{id}/events":
    get:
      operationId: "generationEvents"
      responses:
        "200":
          description: "Success"
          content:
            "application/x-ndjson":
              schema:
                type: "string"
              x-recordSchema:
                "$ref": "#/components/schemas/GenerationRecord"
        default:
          "$ref": "#/components/responses/APIError"
      description: "A bounded NDJSON stream of complete GenerationRecord values, with the latest record repeated as a two-second heartbeat. Ends after a terminal record."
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            "$ref": "#/components/schemas/UUID"
  "/v1/generations/{id}/artifacts/{filename}":
    get:
      operationId: "downloadArtifact"
      responses:
        "200":
          description: "Success"
          content:
            "application/octet-stream":
              schema:
                type: "string"
                format: "binary"
            "audio/wav":
              schema:
                type: "string"
                format: "binary"
            "image/png":
              schema:
                type: "string"
                format: "binary"
            "application/json":
              schema:
                type: "string"
                format: "binary"
            "text/plain":
              schema:
                type: "string"
        default:
          "$ref": "#/components/responses/APIError"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            "$ref": "#/components/schemas/UUID"
        -
          name: "filename"
          in: "path"
          required: true
          schema:
            type: "string"
            enum:
              - "inference.wav"
              - "original.wav"
              - "metadata.json"
              - "transcript.txt"
              - "source.json"
              - "source.wav"
              - "opus.json"
              - "screenshot.png"
              - "built-in-audio.bin"
  "/v1/imports/wispr-flow/known":
    post:
      operationId: "knownWisprFlowIDs"
      responses:
        "200":
          description: "Success"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/WisprFlowKnownIDsResponse"
        default:
          "$ref": "#/components/responses/APIError"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/WisprFlowKnownIDsRequest"
        x-maximumBytes: 262144
  "/v1/imports/wispr-flow":
    post:
      operationId: "beginWisprFlowImport"
      responses:
        "201":
          description: "Success"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/WisprFlowImportSession"
        default:
          "$ref": "#/components/responses/APIError"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/WisprFlowImportRequest"
        x-maximumBytes: 262144
  "/v1/imports/wispr-flow/dictionary":
    put:
      operationId: "archiveWisprFlowDictionary"
      responses:
        "200":
          description: "Success"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/WisprFlowDictionaryArchiveReceipt"
        default:
          "$ref": "#/components/responses/APIError"
      requestBody:
        required: true
        content:
          "application/json":
            schema: {}
        x-maximumBytes: 8388608
        description: "Original Wispr Flow dictionary JSON archive. This does not change the active personal dictionary."
  "/v1/imports/wispr-flow/{id}/artifacts/{filename}":
    put:
      operationId: "uploadWisprFlowArtifact"
      responses:
        "200":
          description: "Success"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/WisprFlowArtifactReceipt"
        default:
          "$ref": "#/components/responses/APIError"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            "$ref": "#/components/schemas/UUID"
        -
          name: "filename"
          in: "path"
          required: true
          schema:
            "$ref": "#/components/schemas/WisprFlowArtifactName"
      requestBody:
        required: true
        content:
          "application/octet-stream":
            schema:
              type: "string"
              format: "binary"
          "application/json":
            schema:
              type: "string"
              format: "binary"
          "audio/wav":
            schema:
              type: "string"
              format: "binary"
          "image/png":
            schema:
              type: "string"
              format: "binary"
        x-maximumBytes: 8388608
  "/v1/imports/wispr-flow/{id}/complete":
    post:
      operationId: "completeWisprFlowImport"
      responses:
        "200":
          description: "Success"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/WisprFlowImportResult"
        default:
          "$ref": "#/components/responses/APIError"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            "$ref": "#/components/schemas/UUID"
  "/v1/imports/wispr-flow/{id}":
    delete:
      operationId: "cancelWisprFlowImport"
      responses:
        "204":
          description: "Success"
        default:
          "$ref": "#/components/responses/APIError"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            "$ref": "#/components/schemas/UUID"
  /v2/recordings/capabilities:
    get:
      operationId: getRecordingCapabilities
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingCapabilities"
        default:
          $ref: "#/components/responses/APIError"
  /v2/recordings:
    post:
      operationId: createRecording
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingSnapshot"
        default:
          $ref: "#/components/responses/APIError"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGenerationRequest"
    get:
      operationId: listRecordings
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingPage"
        default:
          $ref: "#/components/responses/APIError"
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: before
          in: query
          schema:
            type: string
  /v2/recordings/{id}:
    get:
      operationId: getRecording
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingDetail"
        default:
          $ref: "#/components/responses/APIError"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
  /v2/recordings/{id}/transcript:
    get:
      operationId: getRecordingTranscript
      responses:
        "200":
          description: Success
          content:
            text/plain:
              schema:
                type: string
        default:
          $ref: "#/components/responses/APIError"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
  /v2/recordings/{id}/audio/{kind}:
    get:
      operationId: getRecordingAudio
      responses:
        "200":
          description: Success
          content:
            audio/wav:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/APIError"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
        - name: kind
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/AudioKind"
  /v2/recordings/{id}/discard:
    post:
      operationId: discardRecording
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordingSnapshot"
        default:
          $ref: "#/components/responses/APIError"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
  /v2/recordings/{id}/delivery:
    post:
      operationId: recordRecordingDelivery
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationRecord"
        default:
          $ref: "#/components/responses/APIError"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryReceipt"
  /v2/recordings/{id}/stream:
    get:
      operationId: streamRecording
      description: Upgrade to WebSocket subprotocol sotto.recording.v1. Binary audio is UInt32BE JSON
        header length, UTF8 RecordingAudioHeader, then little-endian float32 PCM. Text controls
        resume, context, pause, stop and ping; server sends snapshots, acknowledgments, progress and
        errors. See docs/recording-protocol.md for durable ACK, fencing and resume semantics.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
      responses:
        "101":
          description: WebSocket upgrade
        default:
          $ref: "#/components/responses/APIError"
  /v2/recordings/{id}/audio/{kind}/{runID}:
    get:
      operationId: getRecordingRunAudio
      responses:
        "200":
          description: Success
          content:
            audio/wav:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/APIError"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
        - name: kind
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/AudioKind"
        - name: runID
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
components:
  schemas:
    UUID:
      type: "string"
      format: "uuid"
    GenerationMode:
      type: "string"
      enum:
        - "dictation"
        - "test"
        - "file"
    GenerationStatus:
      type: "string"
      enum:
        - "receiving"
        - "queued"
        - "transcribing"
        - "proofreading"
        - "completed"
        - "failed"
        - "cancelled"
    AudioKind:
      type: "string"
      enum:
        - "inference"
        - "original"
    WisprFlowArtifactName:
      type: "string"
      enum:
        - "source.json"
        - "source.wav"
        - "opus.json"
        - "screenshot.png"
        - "built-in-audio.bin"
    WisprFlowImportOutcome:
      type: "string"
      enum:
        - "imported"
        - "enriched"
        - "skipped"
        - "partial"
    TextProcessingStatus:
      type: "string"
      enum:
        - "disabled"
        - "unavailable"
        - "applied"
        - "unchanged"
        - "rejected"
        - "failed"
        - "skipped"
    SpokenListStyle:
      type: "string"
      enum:
        - "numbered"
        - "bulleted"
    DictationBoundary:
      type: "string"
      enum:
        - "none"
        - "line"
        - "paragraph"
    DictionaryEntry:
      type: "object"
      additionalProperties: false
      properties:
        id:
          type: "string"
          minLength: 1
          x-maximumGraphemes: 128
        term:
          type: "string"
          minLength: 1
          x-maximumGraphemes: 128
        aliases:
          type: "array"
          items:
            type: "string"
            minLength: 1
            x-maximumGraphemes: 128
          maxItems: 8
          default: []
        isPriority:
          type: "boolean"
          default: false
      required:
        - "id"
        - "term"
    DictionaryList:
      type: "object"
      additionalProperties: false
      properties:
        id:
          type: "string"
          minLength: 1
          x-maximumGraphemes: 128
        name:
          type: "string"
          minLength: 1
          x-maximumGraphemes: 80
        entries:
          type: "array"
          items:
            "$ref": "#/components/schemas/DictionaryEntry"
          maxItems: 500
          default: []
      required:
        - "id"
        - "name"
    PersonalDictionary:
      type: "object"
      additionalProperties: false
      properties:
        lists:
          type: "array"
          items:
            "$ref": "#/components/schemas/DictionaryList"
          maxItems: 32
      required:
        - "lists"
    DeviceIdentity:
      type: "object"
      additionalProperties: false
      properties:
        id:
          type: "string"
        name:
          type: "string"
      required:
        - "id"
        - "name"
    ServerPreferences:
      type: "object"
      additionalProperties: false
      properties:
        language:
          type: "string"
          enum:
            - "en"
            - "auto"
            - "es"
            - "fr"
            - "de"
            - "it"
            - "pt"
            - "nl"
            - "ja"
            - "zh"
            - "ko"
            - "hi"
            - "ar"
            - "pl"
            - "ru"
            - "uk"
            - "sv"
        proofreadingPrompt:
          type: "string"
          minLength: 1
          description: "Missing values use the built-in cleanup prompt; maximum UTF-8 size is 4096 bytes."
        vocabulary:
          type: "string"
          description: "Maximum UTF-8 size is 16384 bytes."
        dictionary:
          "$ref": "#/components/schemas/PersonalDictionary"
        textCorrectionEnabled:
          type: "boolean"
        keepOriginalAudio:
          type: "boolean"
      required:
        - "language"
        - "vocabulary"
        - "dictionary"
        - "textCorrectionEnabled"
        - "keepOriginalAudio"
    PreferencesSnapshot:
      type: "object"
      additionalProperties: false
      properties:
        revision:
          type: "integer"
          minimum: 0
          maximum: 9007199254740991
        preferences:
          "$ref": "#/components/schemas/ServerPreferences"
      required:
        - "revision"
        - "preferences"
    ModelRuntimeInfo:
      type: "object"
      additionalProperties: false
      properties:
        modelID:
          type: "string"
        backend:
          type: "string"
        ready:
          type: "boolean"
        message:
          type: "string"
      required:
        - "modelID"
        - "backend"
        - "ready"
    ServerHealth:
      type: "object"
      additionalProperties: false
      properties:
        apiVersion:
          type: "integer"
          minimum: 0
          maximum: 9007199254740991
        serverVersion:
          type: "string"
        isDev:
          type: "boolean"
        ready:
          type: "boolean"
        speech:
          "$ref": "#/components/schemas/ModelRuntimeInfo"
        proofreading:
          "$ref": "#/components/schemas/ModelRuntimeInfo"
        message:
          type: "string"
      required:
        - "apiVersion"
        - "serverVersion"
        - "isDev"
        - "ready"
        - "speech"
        - "proofreading"
    CreateGenerationRequest:
      type: "object"
      additionalProperties: false
      properties:
        requestID:
          "$ref": "#/components/schemas/UUID"
        device:
          "$ref": "#/components/schemas/DeviceIdentity"
        mode:
          "$ref": "#/components/schemas/GenerationMode"
      required:
        - "requestID"
        - "device"
        - "mode"
    AudioStreamFormat:
      type: "object"
      additionalProperties: false
      properties:
        sampleRate:
          type: "integer"
          minimum: 8000
          maximum: 192000
        channels:
          type: "integer"
          minimum: 1
          maximum: 8
      required:
        - "sampleRate"
        - "channels"
    AudioChunkReceipt:
      type: "object"
      additionalProperties: false
      properties:
        nextSequence:
          type: "integer"
          minimum: 0
          maximum: 9007199254740991
        frameCount:
          type: "integer"
          minimum: 0
          maximum: 9007199254740991
          format: "int64"
      required:
        - "nextSequence"
        - "frameCount"
    FinishGenerationRequest:
      type: "object"
      additionalProperties: false
      properties:
        inferenceFrames:
          type: "integer"
          minimum: 0
          maximum: 9007199254740991
          format: "int64"
        originalFrames:
          type: "integer"
          minimum: 0
          maximum: 9007199254740991
          format: "int64"
        continuationID:
          "$ref": "#/components/schemas/UUID"
      required:
        - "inferenceFrames"
    AudioArtifact:
      type: "object"
      additionalProperties: false
      properties:
        filename:
          type: "string"
        sampleRate:
          type: "integer"
          minimum: 1
          maximum: 9007199254740991
        channels:
          type: "integer"
          minimum: 1
          maximum: 9007199254740991
        frameCount:
          type: "integer"
          minimum: 0
          maximum: 9007199254740991
          format: "int64"
        byteCount:
          type: "integer"
          minimum: 0
          maximum: 9007199254740991
          format: "int64"
        encoding:
          type: "string"
      required:
        - "filename"

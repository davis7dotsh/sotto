name: TypeScript server

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Server checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run fmt:check
      - run: bun run check
      - run: bun run test
      - run: bun run generate:api --check --typescript-only

  swift:
    name: Swift API compatibility
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Verify Swift toolchain
        run: |
          swift --version
          swift -e '
          #if compiler(<6.2)
          #error("Swift 6.2 or newer is required.")
          #endif
          '
      - run: bun install --frozen-lockfile
      - run: bun run generate:api --check
      - name: Test Swift packages without launching the client
        run: swift test

  coordinator:
    name: Compiled server (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: bun-darwin-arm64
          - runner: ubuntu-24.04
            target: bun-linux-x64
          - runner: ubuntu-24.04-arm
            target: bun-linux-arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run --cwd Server build --target=${{ matrix.target }}
      - name: Smoke compiled executable
        run: ./build/server/v07-server --help
      - name: Test compiled HTTP server
        run: bun Server/scripts/smoke.ts --executable ./build/server/v07-server
      - name: Verify native directory lock and compiled FFI
        run: bun test Server/tests/data-lock.test.ts
      - name: Verify embedded correction worker
        run: bun test Server/tests/correction-worker-standalone.test.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v07-server-coordinator-${{ matrix.target }}
          path: build/server/v07-server
          if-no-files-found: error

  native:
    name: Native CPU helpers (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential pkg-config libcurl4-openssl-dev
      - name: Build portable CPU package
        env:
          V07_NATIVE: "OFF"
          V07_CUDA: "OFF"
          V07_BUILD_JOBS: "4"
        run: ./scripts/build-server.sh
      - run: ./build/server/v07-server --help
      - name: Test packaged HTTP server
        run: bun Server/scripts/smoke.ts --executable ./build/server/v07-server
      - name: Archive complete platform package
        run: tar -czf build/v07-server-${{ matrix.platform }}-cpu.tar.gz -C build server
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v07-server-${{ matrix.platform }}-cpu
          path: build/v07-server-${{ matrix.platform }}-cpu.tar.gz
          if-no-files-found: error
